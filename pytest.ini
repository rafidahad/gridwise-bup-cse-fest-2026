[pytest]
testpaths = tests
filterwarnings =
    # PuLP 3.3.2 pre-announces its 4.0 API. The pinned version is the tested
    # one; the warnings are noise, not a defect in this service.
    ignore:Constructing LpVariable.*:DeprecationWarning
    ignore:PULP_CBC_CMD is deprecated.*:DeprecationWarning
